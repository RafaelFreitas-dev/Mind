# Fuso horário da JVM fixado para Brasília (UTC-3)
spring.jackson.time-zone=America/Sao_Paulo

# Configurações do MongoDB
# A connection string do MongoDB Atlas (com usuário e senha) fica no arquivo
# backend/.env, que NÃO vai para o Git — veja backend/.env.example.
# Sem esse arquivo (ou sem a variável de ambiente MONGODB_URI), o backend
# continua usando o MongoDB local.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/mindDB}
spring.data.mongodb.database=mindDB

# Configurações JWT
jwt.secret=MindYourMindSecretKeyForJWT2024ThisMustBeAtLeast32CharactersLong
jwt.expiration.ms=900000
jwt.refresh.expiration.ms=86400000

# Porta do servidor
server.port=8080

# Configurações Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Configurações de log (opcional)
logging.level.org.springframework.security=DEBUG
logging.level.com.mind_your.mind=DEBUG